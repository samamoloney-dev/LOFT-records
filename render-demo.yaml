# Render Blueprint for the DEMONSTRATION site only - a completely separate
# database, backend and frontend from the live Skippers deployment, holding
# fictional data. Kept in its own file (not render.yaml) so it can never
# change the live services. Create it in Render with:
#   New > Blueprint > pick this repo and branch > set "Blueprint file path"
#   to render-demo.yaml.
#
# After the first deploy, set these by hand (sync: false values):
#   fs-demo-backend:  CORS_ORIGIN       the demo frontend's URL (exactly, no trailing slash)
#                     DEMO_PASSWORD     shared password for the demo logins (8+ characters)
#                     DEMO_RESET_TOKEN  secret that allows POST /api/demo/reset
#   fs-demo-frontend: VITE_API_URL      the demo backend's URL, then redeploy the frontend
#                                       (Vite bakes this in at build time)
databases:
  - name: fs-demo-db
    plan: basic-256mb
    postgresMajorVersion: "16"

services:
  - type: web
    name: fs-demo-backend
    runtime: node
    plan: starter
    rootDir: backend
    buildCommand: npm install
    startCommand: npm run migrate && npm run demo:bootstrap && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fs-demo-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: DEMO_PASSWORD
        sync: false
      - key: DEMO_RESET_TOKEN
        sync: false
      - key: OPERATOR_PROFILE
        value: demo135
      - key: DEMO_MODE
        value: "true"
      - key: PORT
        value: 4000
      - key: NODE_ENV
        value: production

  - type: web
    name: fs-demo-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
