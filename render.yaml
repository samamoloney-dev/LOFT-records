databases:
  - name: loft-records-db
    plan: basic-256mb
    postgresMajorVersion: "16"

services:
  - type: web
    name: loft-records-backend
    runtime: node
    plan: starter
    rootDir: backend
    buildCommand: npm install
    startCommand: npm run migrate && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: loft-records-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: PORT
        value: 4000
      - key: NODE_ENV
        value: production
      # Required for the daily competency digest email (see
      # backend/src/lib/email.js) - set manually in the Render dashboard,
      # not generated here, since it's the operator's own Resend account
      # credential. The digest silently skips sending (logs a warning)
      # until this is set.
      - key: RESEND_API_KEY
        sync: false
      # Optional - defaults to Resend's own sandbox sender, which only
      # delivers to the Resend account's own verified address. Set this to
      # a "Name <address@yourdomain>" once a sending domain is verified in
      # Resend, so the digest can actually reach HOTC/HOFO/Flight Ops
      # Admin/Alternate's real inboxes.
      - key: DIGEST_FROM_EMAIL
        sync: false

  - type: web
    name: loft-records-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
